services:
  backend:
    build:
      context: ./interface-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/inference.db
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./interface_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:

